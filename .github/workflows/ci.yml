name: CI/CD Pipeline - BiblioExchange v2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # 1. QUALITÉ & TESTS UNITAIRES / INTÉGRATION
  # ----------------------------------------------------
  test:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Contrôle de la qualité du code (Flake8)
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Exécution des tests Pytest (Environnement isolé SQLite)
        env:
          PYTHONPATH: ./backend
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci_test_secret_key_for_jwt_verification"
        run: |
          cd backend
          pytest -v --cov=app tests/

  # ----------------------------------------------------
  # 2. BUILD ET PUBLICATION DES IMAGES DOCKER
  # ----------------------------------------------------
  build:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push - Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioexchange-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioexchange-backend:${{ github.sha }}

      - name: Build & Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioexchange-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioexchange-frontend:${{ github.sha }}

  # ----------------------------------------------------
  # 3. DÉPLOIEMENT AUTOMATIQUE SUR EC2 (AWS)
  # ----------------------------------------------------
  deploy:
    name: SSH Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Execution des commandes de déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd biblioexchange_ASD
            git pull origin main
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f

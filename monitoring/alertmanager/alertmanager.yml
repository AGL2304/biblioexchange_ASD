global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    # Aucun canal de notification externe configure pour l'instant : les alertes
    # restent visibles dans l'UI Alertmanager (port 9093) et via son API.
    # Pour une vraie notification, ajouter ici un bloc, par exemple :
    #
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    #
    # ou email_configs / slack_configs selon le canal choisi.
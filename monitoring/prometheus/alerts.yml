groups:
  - name: biblioexchange
    rules:
      - alert: APIDown
        expr: up{job="biblioexchange-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'API BiblioExchange ne répond plus"

      - alert: TauxErreurEleve
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur l'API"

      - alert: PicSignalementsEnAttente
        expr: biblioexchange_reports_open > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 5 signalements ouverts depuis 10 minutes"
          description: "{{ $value }} signalements sont en attente de traitement par un administrateur."

      - alert: FileModerationSaturee
        expr: biblioexchange_books_pending_moderation > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "File de modération des livres saturée"
          description: "{{ $value }} livres attendent une validation admin depuis plus de 30 minutes."
services:
  frontend:
    image: agl23/biblioexchange-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - biblioexchange

  backend:
    image: agl23/biblioexchange-backend:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - biblioexchange

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - biblioexchange

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - node-exporter
    networks:
      - biblioexchange

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "9100"
    networks:
      - biblioexchange

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - biblioexchange

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - biblioexchange

networks:
  biblioexchange:

volumes:
  db_data:
  grafana_data:
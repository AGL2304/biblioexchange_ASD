<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiblioExchange — Profil</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22; --paper:#EFEAD9; --paper-2:#E5DEC7;
    --green:#2F4B3C; --green-dark:#1C3227;
    --brass:#B8863B; --brass-dark:#8C6528;
    --rust:#A64B2A; --muted:#6B6558; --line:#D8CFB4;
  }
  body{background:var(--paper); color:var(--ink); font-family:'Source Sans 3',sans-serif;}
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .card{background:rgba(255,255,255,.55); border:1px solid var(--line);}
  .field{border:1px solid var(--line); background:#fff;}
  .field:focus{outline:none; border-color:var(--brass);}
  .stamp{border:1.5px dashed var(--brass-dark); font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; color:var(--brass-dark);}
  .row-line{border-color:var(--line);}
  .nav-link{position:relative;}
  .nav-link.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--brass);}
</style>
</head>
<body class="min-h-screen">

<header class="border-b" style="border-color:var(--line)">
  <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
    <a href="index.html" class="font-display text-2xl" style="color:var(--green-dark)">BiblioExchange</a>
    <nav class="hidden md:flex gap-8 text-sm" style="color:var(--muted)">
      <a href="index.html" class="nav-link">Accueil</a>
      <a href="mes-livres.html" class="nav-link">Mes livres</a>
      <a href="proposer-echange.html" class="nav-link">Échanges</a>
      <a href="notifications.html" class="nav-link">Notifications</a>
      <a href="profil.html" class="nav-link active" style="color:var(--ink)">Profil</a>
    </nav>
    <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-mono" style="background:var(--green-dark);color:var(--paper)">GA</div>
  </div>
</header>

<section class="max-w-4xl mx-auto px-6 pt-12 pb-6">
  <p class="font-mono text-xs uppercase tracking-widest mb-2" style="color:var(--brass-dark)">Fiche de membre</p>
  <h1 class="font-display text-3xl" style="color:var(--green-dark)">Mon profil</h1>
</section>

<section class="max-w-4xl mx-auto px-6 pb-20 grid grid-cols-1 md:grid-cols-[1fr_320px] gap-6">

  <div class="card rounded-sm p-6">
    <h2 class="font-mono text-xs uppercase tracking-widest mb-5" style="color:var(--muted)">Informations</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="font-mono text-xs uppercase" style="color:var(--muted)">Nom</label>
        <input type="text" value="Georges Anani" class="w-full mt-1.5 px-4 py-3 rounded-sm field">
      </div>
      <div>
        <label class="font-mono text-xs uppercase" style="color:var(--muted)">Email</label>
        <input type="email" value="georges.anani@mail.com" class="w-full mt-1.5 px-4 py-3 rounded-sm field">
      </div>
      <div class="sm:col-span-2">
        <label class="font-mono text-xs uppercase" style="color:var(--muted)">Ville</label>
        <input type="text" value="Amiens" class="w-full mt-1.5 px-4 py-3 rounded-sm field">
      </div>
    </div>
    <button class="mt-6 px-6 py-3 rounded-sm font-mono text-sm uppercase tracking-wide text-white" style="background:var(--green-dark)">
      Enregistrer
    </button>

    <div class="mt-10 pt-6 border-t" style="border-color:var(--line)">
      <h2 class="font-mono text-xs uppercase tracking-widest mb-4" style="color:var(--muted)">Mot de passe</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <input type="password" placeholder="Nouveau mot de passe" class="px-4 py-3 rounded-sm field">
        <input type="password" placeholder="Confirmer" class="px-4 py-3 rounded-sm field">
      </div>
      <button class="mt-6 px-6 py-3 rounded-sm font-mono text-sm uppercase tracking-wide" style="border:1px solid var(--brass-dark); color:var(--brass-dark)">
        Mettre à jour
      </button>
    </div>
  </div>

  <div class="space-y-6">
    <div class="card rounded-sm p-6 text-center">
      <div class="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-2xl font-mono" style="background:var(--green-dark);color:var(--paper)">GA</div>
      <p class="font-display text-lg mt-4" style="color:var(--green-dark)">Georges Anani</p>
      <div class="mt-3 inline-block px-2.5 py-1 text-xs stamp">Membre depuis 2024</div>
    </div>

    <div class="card rounded-sm p-6">
      <h2 class="font-mono text-xs uppercase tracking-widest mb-4" style="color:var(--muted)">Historique</h2>
      <dl class="space-y-3 font-mono text-sm">
        <div class="flex justify-between"><dt style="color:var(--muted)">Livres publiés</dt><dd style="color:var(--ink)">9</dd></div>
        <div class="flex justify-between"><dt style="color:var(--muted)">Échanges réalisés</dt><dd style="color:var(--ink)">12</dd></div>
        <div class="flex justify-between"><dt style="color:var(--muted)">Échanges en cours</dt><dd style="color:var(--ink)">1</dd></div>
      </dl>
    </div>
  </div>

</section>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiblioExchange — Connexion</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22; --paper:#EFEAD9; --green:#2F4B3C; --green-dark:#1C3227;
    --brass:#B8863B; --brass-dark:#8C6528; --rust:#A64B2A; --muted:#6B6558; --line:#D8CFB4;
  }
  body{background:var(--paper); color:var(--ink); font-family:'Source Sans 3',sans-serif;}
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .card{background:rgba(255,255,255,.55); border:1px solid var(--line);}
  .field{border:1px solid var(--line); background:#fff;}
  .field:focus{outline:none; border-color:var(--brass);}
  .tab{cursor:pointer; padding-bottom:8px; border-bottom:2px solid transparent; font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  .tab.active{color:var(--green-dark); border-color:var(--brass);}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">

<div class="w-full max-w-sm">
  <a href="index.html" class="font-display text-2xl block text-center mb-8" style="color:var(--green-dark)">BiblioExchange</a>

  <div class="card rounded-sm p-8">
    <div class="flex gap-6 border-b mb-6" style="border-color:var(--line)">
      <div class="tab active" data-tab="login">Connexion</div>
      <div class="tab" data-tab="register">Créer un compte</div>
    </div>

    <form id="form-login" class="space-y-4">
      <input type="email" id="login-email" placeholder="Email" required class="w-full px-4 py-3 rounded-sm field">
      <input type="password" id="login-password" placeholder="Mot de passe" required class="w-full px-4 py-3 rounded-sm field">
      <button type="submit" class="w-full px-6 py-3 rounded-sm font-mono text-sm uppercase tracking-wide text-white" style="background:var(--green-dark)">
        Se connecter
      </button>
      <p id="login-error" class="text-sm hidden" style="color:var(--rust)"></p>
    </form>

    <form id="form-register" class="space-y-4 hidden">
      <input type="text" id="register-nom" placeholder="Nom" required class="w-full px-4 py-3 rounded-sm field">
      <input type="email" id="register-email" placeholder="Email" required class="w-full px-4 py-3 rounded-sm field">
      <input type="password" id="register-password" placeholder="Mot de passe" required minlength="8" class="w-full px-4 py-3 rounded-sm field">
      <button type="submit" class="w-full px-6 py-3 rounded-sm font-mono text-sm uppercase tracking-wide text-white" style="background:var(--green-dark)">
        Créer mon compte
      </button>
      <p id="register-error" class="text-sm hidden" style="color:var(--rust)"></p>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("form-login").classList.toggle("hidden", tab.dataset.tab !== "login");
    document.getElementById("form-register").classList.toggle("hidden", tab.dataset.tab !== "register");
  });
});

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("login-error");
  errEl.classList.add("hidden");
  try {
    await api.login(document.getElementById("login-email").value, document.getElementById("login-password").value);
    window.location.href = "index.html";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  }
});

document.getElementById("form-register").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("register-error");
  errEl.classList.add("hidden");
  try {
    await api.register(
      document.getElementById("register-email").value,
      document.getElementById("register-password").value,
      document.getElementById("register-nom").value
    );
    await api.login(document.getElementById("register-email").value, document.getElementById("register-password").value);
    window.location.href = "index.html";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>

services:
  backend-test:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://test:test@db-test:5432/test
      - JWT_SECRET=test-secret
    depends_on:
      - db-test
    command: ["pytest", "tests"]
    networks:
      - biblioexchange-test

  db-test:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
    networks:
      - biblioexchange-test

networks:
  biblioexchange-test:
